name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end test (development build)
        run: npm run e2e

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-build-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Resolve release directory
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "RELEASE_DIR=releases/$version" >> $env:GITHUB_ENV

      - name: Build installers
        run: npm run dist

      - name: End-to-end test (packaged build)
        run: npm run e2e:packaged

      - name: Upload unsigned installers for SignPath
        id: upload-unsigned
        if: env.SIGNPATH_API_TOKEN != '' && env.CSC_LINK == ''
        uses: actions/upload-artifact@v4
        with:
          name: Inkdown-unsigned-${{ github.ref_name }}
          path: ${{ env.RELEASE_DIR }}/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installers with SignPath
        if: env.SIGNPATH_API_TOKEN != '' && env.CSC_LINK == ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: release-signed

      - name: Apply signed installers
        if: env.SIGNPATH_API_TOKEN != '' && env.CSC_LINK == ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem release-signed -Recurse -Filter *.exe
          if (-not $signed) { throw 'SignPath returned no executables' }
          $signed | Copy-Item -Destination $env:RELEASE_DIR -Force
          Remove-Item "$env:RELEASE_DIR/*.blockmap" -ErrorAction SilentlyContinue
          node scripts/refresh-latest-yml.mjs $env:RELEASE_DIR

      - name: Verify Windows signatures
        if: env.SIGNPATH_API_TOKEN != '' || env.CSC_LINK != ''
        shell: pwsh
        run: |
          $installers = Get-ChildItem "$env:RELEASE_DIR/*.exe"
          if (-not $installers) { throw 'No installers found' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($installer.Name) is not validly signed: $($signature.Status)"
            }
            Write-Host "$($installer.Name) signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Inkdown-${{ github.ref_name }}
          path: |
            ${{ env.RELEASE_DIR }}/*.exe
            ${{ env.RELEASE_DIR }}/*.blockmap
            ${{ env.RELEASE_DIR }}/latest*.yml
          if-no-files-found: error
