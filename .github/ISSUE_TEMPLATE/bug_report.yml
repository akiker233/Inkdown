name: 缺陷报告
description: 报告一个可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现的步骤与最小示例文档；安全漏洞请按 [SECURITY.md](https://github.com/akiker233/Inkdown/blob/main/SECURITY.md) 私下报告。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要说明发生了什么，以及它对使用的影响。
      placeholder: 例如：在表格单元格中粘贴多行文本后，表格边框消失。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序列出最小复现步骤。
      placeholder: |
        1. 打开 ...
        2. 输入 ...
        3. 点击 ...
        4. 观察到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 你期望看到什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: 实际发生了什么？如有报错信息请一并粘贴。
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Inkdown 版本
      description: 可在“帮助 → 关于”或安装包文件名中查看。
      placeholder: 例如 0.1.0
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - 安装版 (Setup)
        - 便携版 (Portable)
        - 开发模式 (npm run dev)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志、截图或示例文档
      description: 可直接拖拽图片；日志或 Markdown 示例请使用代码块包裹。
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，确认不是重复问题
          required: true
        - label: 已在最新版本上复现
          required: true
        - label: 已移除文档中的敏感信息
          required: true
