name: 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先说明使用场景与当前的不便，再描述期望的方案；较大的功能建议会先讨论方向再进入实现。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你在什么情况下遇到了什么不便？现在是如何绕过的？
      placeholder: 例如：整理长文档时无法快速折叠二级标题，只能滚动查找。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望 Inkdown 如何解决这个问题？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否有其他工具或做法可以满足需求？

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、参考链接、相似产品的实现方式等。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，确认不是重复建议
          required: true
